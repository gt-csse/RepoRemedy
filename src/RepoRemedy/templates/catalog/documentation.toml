change_summary = "**What are issue templates?** They're forms that GitHub shows when someone opens a new issue. They ask for the details you need, such as steps to reproduce a bug, so reports are easier to act on. This repository doesn't have them yet, so this PR adds a bug-report and a feature-request template under `.github/ISSUE_TEMPLATE/`.\n\nEdit the questions to fit your project, and delete a template you don't want."
