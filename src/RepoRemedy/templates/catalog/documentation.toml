[remedies."security-policy".pr]
title = "Add SECURITY.md to ${repository}"
body = "create-files-pr.md"
change_summary = "**What is `SECURITY.md`?** It's the file GitHub uses to tell people how to report a security vulnerability in a project. When it's present, GitHub shows a \"Report a vulnerability\" link on the repository so researchers know where to send issues privately instead of opening a public one. This repository doesn't have this file yet, so this PR adds it.\n\nThe added `SECURITY.md` highlights the recommended best practice for reporting: **GitHub's private vulnerability reporting**, a built-in, private channel between researchers and maintainers. **If you haven't already, please turn it on** under the repository's **Settings → Code security**, then enable [Private vulnerability reporting](https://docs.github.com/en/code-security/how-tos/report-and-fix-vulnerabilities/configure-vulnerability-reporting/configure-for-a-repository).\n\n**Prefer to receive reports a different way?** Just edit `SECURITY.md` to point to your preferred contact instead, for example a dedicated security email address."
required_inputs = [
    "repository",
    "origin",
    "check",
    "evidence",
    "verification_steps",
    "security_reporting_instructions",
    "supported_versions",
]
guards = ["confirmed_gap", "target_absent", "no_equivalent_file", "approved_inputs"]

[[remedies."security-policy".pr.files]]
path = "SECURITY.md"
template = "SECURITY.md"
operation = "create"
