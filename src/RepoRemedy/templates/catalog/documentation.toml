schema_version = 3

[remedies."ra-citation"]
sources = { RA = ["Citation"] }
response = "Add accurate citation metadata from project records and validate its format."

[remedies."ra-citation".issue]
title = "Citation metadata is missing or not detected in ${repository}"
body = "documentation-issue.md"
required_inputs = [
    "repository",
    "origin",
    "check",
    "evidence",
    "target",
    "observed_state",
    "verification_steps",
]

[remedies."ra-citation".pr]
title = "Add CITATION.cff to ${repository}"
body = "create-files-pr.md"
change_summary = "Add `CITATION.cff` using reviewed repository information."
required_inputs = [
    "repository",
    "origin",
    "check",
    "evidence",
    "verification_steps",
    "approved_citation_metadata",
]
guards = ["confirmed_gap", "target_absent", "no_equivalent_file", "approved_inputs"]

[[remedies."ra-citation".pr.files]]
path = "CITATION.cff"
template = "CITATION.cff"
operation = "create"

