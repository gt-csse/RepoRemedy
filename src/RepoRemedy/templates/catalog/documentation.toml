schema_version = 3

[remedies."ra-citation"]
sources = { RA = ["Citation"] }
response = "Add accurate citation metadata from project records and validate its format."

[remedies."ra-citation".issue]
title = "Citation metadata is missing or not detected in ${repository}"
body = "documentation-issue.md"
required_inputs = [
    "repository",
    "origin",
    "check",
    "evidence",
    "target",
    "observed_state",
    "verification_steps",
]

[remedies."ra-citation".pr]
title = "Add CITATION.cff to ${repository}"
body = "create-files-pr.md"
change_summary = "**What is `CITATION.cff`?** It's a small file that tells people how to cite this project in papers and software. GitHub reads it and shows a \"Cite this repository\" button on the repository page. This repository doesn't have this file yet, so this PR adds it.\n\nPlease check that the title, authors and version are correct. **Prefer a different citation?** Edit the file before merging."
required_inputs = [
    "repository",
    "origin",
    "check",
    "evidence",
    "verification_steps",
    "approved_citation_metadata",
]
guards = ["confirmed_gap", "target_absent", "no_equivalent_file", "approved_inputs"]

[[remedies."ra-citation".pr.files]]
path = "CITATION.cff"
template = "CITATION.cff"
operation = "create"

