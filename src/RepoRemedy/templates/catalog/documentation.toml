body = "create-files-pr.md"
change_summary = "**What is `CODEOWNERS`?** It's the file that tells GitHub which people or teams own which parts of the code. GitHub automatically asks those owners to review PRs that touch their files. This repository doesn't have this file yet, so this PR adds it.\n\n**Please check every owner listed** has write access to the repository, or GitHub will ignore the rule. If you want owners to be required reviewers, enable \"Require review from Code Owners\" in the branch protection settings."
