response = "Agree who will configure webhook authentication through private settings and verify sender/receiver behavior. Describe only the configuration status and non-secret verification results; never include secret values, credentials or authenticated webhook URLs in proposal inputs."

[remedies."ossf-webhooks".issue]
title = "Webhook authentication configuration needs review in ${repository}"
body = "decision-issue.md"
required_inputs = [
    "repository",
    "origin",
    "check",
    "evidence",
    "target",
    "observed_state",
    "verification_steps",
]

