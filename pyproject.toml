[project]
name = "reporemedy"
version = "0.0.0"
#          ^^^^^
# Wheel names will be generated according to this value. Do not manually modify this value; instead
# update it according to committed changes by running this command from the root of the repository:
#
#   uv run python -m AutoGitSemVer.scripts.UpdatePythonVersion ./pyproject.toml ./src

description = "Lower the barrier to software engineering best practices in open-source repositories"
readme = "README.md"
authors = [
    { name = "Center for Scientific Software Engineering at Georgia Tech", email = "csse-technical@groups.gatech.edu" },
]
requires-python = ">= 3.14"
dependencies = [
    "pydantic>=2.12,<3",
    "typer>=0.27,<0.28",
]
classifiers = [
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
RepoRemedy = "RepoRemedy.cli:app"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/gt-csse/RepoRemedy"
Documentation = "https://github.com/gt-csse/RepoRemedy"
Repository = "https://github.com/gt-csse/RepoRemedy"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "autogitsemver>=0.9.20",
    "pre-commit>=4.6.2",
    "py-minisign>=0.21.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.pytest.ini_options]
addopts = "--verbose -vv --capture=no --cov=RepoRemedy --cov-report html --cov-report term --cov-report xml:coverage.xml --cov-fail-under=95.0"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
exclude = ["tests/**"]

select = ["ALL"]

ignore = [
    "ANN002", # Missing type annotation for `*args`
    "ANN003", # Missing type annotation for `**kwargs`
    "BLE001", # Do not catch blind exception: `Exception`
    "COM812", # Trailing comma missing
    "D105",   # Missing docstring in magic method
    "D107",   # Missing docstring in `__init__` method
    "D202",   # No blank lines allowed after function docstring
    "D203",   # Incorrect blank line before class docstring
    "D213",   # Multi line summary second line
    "E501",   # Line too long
    "FIX002", # Line contains TODO, consider resolving the issue
    "I001",   # Import block is un-sorted or un-formatted
    "N802",   # Function name `xxx` should be lowercase
    "N999",   # Invalid module name
    "RSE102", # Unnecessary parentheses on raise exception
    "S101",   # Use of assert detected
    "TC006",  # Add quotes to type expression in `typing.cast()`
    "TD002",  # Missing author in TODO
    "TD003",  # Missing issue link for this TODO
    "TRY002", # Create your own exception
    "TRY300", # Consider moving this statement to an `else` block
    "UP032",  # Use f-string instead of `format` call
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 20
max-returns = 20

[tool.uv.build-backend]
module-name = "RepoRemedy"
